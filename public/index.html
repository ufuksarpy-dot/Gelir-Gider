<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>BANK OF USY</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Tema: özel bankacılık. Hep koyu: siyah zemin, ince altın çizgiler, altın vurgu, serifli büyük rakamlar. */
:root {
  --zemin: #0c0d10;
  --kart: #14161b;
  --kart2: #1c1f25;
  --yazi: #ece7dc;
  --soluk: #8e8a80;
  --cizgi: #24221c;
  --cerceve: #3a3220;
  --ana: #d4b26a;
  --ana-yazi: #1a1508;
  --ana-acik: #2a2416;
  --iyi: #5fc79a;
  --uyari: #e3955a;
  --kotu: #e06c6c;
  --kotu-acik: #3a1a1a;
  --uyari-acik: #2e2116;
  --golge: none;
  --yaricap: 14px;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
/* Serifli rakamlar hep aynı boyda ve hizada (eski usul inen rakamlar değil). */
.serif, .buyuk, .ekran-tutar, .satir .tutar, .pin-tuslar button, header.ust h1 { font-variant-numeric: lining-nums tabular-nums; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--zemin); color: var(--yazi); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; } /* basılı tutma (−/+ hızlanır, ödemede "Ödendi") iOS menüsü açmasın */
.sayi { font-variant-numeric: tabular-nums; }
main { max-width: 560px; margin: 0 auto; padding: 8px 16px 24px; }
header.ust { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 2px 8px; }
header.ust h1 { font-family: var(--serif); font-weight: 400; font-size: 22px; margin: 0; letter-spacing: .04em; color: var(--ana); }
header.ust small { color: var(--soluk); }
h2 { font-size: 12px; font-weight: 500; letter-spacing: .14em; color: var(--soluk); margin: 24px 4px 8px; }
.kart { background: var(--kart); border: 0.5px solid var(--cerceve); border-radius: var(--yaricap); padding: 16px; margin-bottom: 10px; }
.kart.ince { padding: 4px 0; }
.buyuk { font-family: var(--serif); font-size: 36px; font-weight: 400; letter-spacing: .01em; }
.serif { font-family: var(--serif); font-weight: 400; }
.soluk { color: var(--soluk); }
.kucuk { font-size: 13px; }
.iyi { color: var(--iyi); } .kotu { color: var(--kotu); } .uyari { color: var(--uyari); }
.satir { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--cizgi); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.kart.ince > .satir:last-child { border-bottom: 0; }
.satir .ad { flex: 1; min-width: 0; }
.satir .ad b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.satir .ad span { font-size: 13px; color: var(--soluk); }
.satir .tutar { font-family: var(--serif); font-size: 17px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.simge { width: 36px; height: 36px; border-radius: 10px; background: var(--kart2); display: grid; place-items: center; font-size: 18px; flex: none; }
.cubuk { height: 3px; background: var(--kart2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.cubuk > i { display: block; height: 100%; background: var(--ana); border-radius: 99px; }
.cubuk.asim > i { background: var(--kotu); }
.cubuk.yakin > i { background: var(--uyari); }
.ikili { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.btn { border: 0.5px solid var(--cerceve); border-radius: 12px; padding: 12px 16px; background: var(--kart2); font-weight: 500; }
.btn.ana { background: var(--ana); color: var(--ana-yazi); border-color: var(--ana); }
.btn.tehlike { background: var(--kotu-acik); color: var(--kotu); }
.btn.tam { width: 100%; }
.btn:disabled { opacity: .5; }
.btnlar { display: flex; gap: 8px; margin-top: 12px; }
.btnlar > * { flex: 1; }
.bilgi { background: var(--ana-acik); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; font-size: 15px; }
.dikkat { background: var(--uyari-acik); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; font-size: 14px; }
.dikkat.kotu { background: var(--kotu-acik); }
.etiket { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--kart2); color: var(--soluk); margin-left: 6px; vertical-align: middle; }
.bos { color: var(--soluk); text-align: center; padding: 18px; font-size: 14px; }

/* alt menü */
nav.alt { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--kart) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--cizgi); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: flex; justify-content: space-around; align-items: center; z-index: 10; }
nav.alt button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--soluk); padding: 4px 10px; min-width: 60px; }
nav.alt button.secili { color: var(--ana); }
nav.alt svg { width: 24px; height: 24px; }
nav.alt button.arti { background: var(--ana); color: var(--ana-yazi); width: 56px; height: 56px; min-width: 56px; border-radius: 50%; margin-top: -26px; box-shadow: 0 0 0 4px var(--zemin), 0 0 0 5px var(--cerceve); justify-content: center; }
nav.alt button.arti svg { width: 28px; height: 28px; }

/* alt sayfa (sheet) */
.perde { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 20; opacity: 0; transition: opacity .2s; }
.perde.acik { opacity: 1; }
.sayfa { position: fixed; left: 0; right: 0; bottom: 0; max-height: 94dvh; overflow-y: auto; background: var(--zemin); border-radius: 20px 20px 0 0; z-index: 21; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s ease; max-width: 600px; margin: 0 auto; overscroll-behavior: contain; }
.sayfa.acik { transform: none; }
.sayfa.tam { height: 94dvh; }
.sayfa .tutamak { width: 40px; height: 5px; border-radius: 9px; background: var(--cizgi); margin: 4px auto 10px; }
.sayfa h3 { margin: 4px 0 12px; font-size: 19px; display: flex; justify-content: space-between; align-items: center; }
.kapat { background: var(--kart2); border: 0; border-radius: 99px; width: 32px; height: 32px; font-size: 18px; line-height: 1; }

/* form */
label.alan { display: block; margin-bottom: 12px; }
label.alan > span { display: block; font-size: 13px; color: var(--soluk); margin: 0 4px 4px; }
input[type=text], input[type=number], input[type=date], input:not([type]), select, textarea, input[inputmode] {
  width: 100%; border: 1px solid var(--cizgi); background: var(--kart); border-radius: 12px; padding: 11px 12px; font-size: 16px; appearance: none; -webkit-appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--soluk) 50%), linear-gradient(135deg, var(--soluk) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--ana); outline-offset: -1px; }
.yan { display: flex; gap: 8px; }
.yan > * { flex: 1; min-width: 0; }
.anahtar { display: flex; align-items: center; justify-content: space-between; padding: 10px 4px; gap: 12px; }
.anahtar input { width: 22px; height: 22px; accent-color: var(--ana); flex: none; }
.cipler { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.cip { border: 0.5px solid var(--cerceve); background: var(--kart); color: var(--yazi); border-radius: 99px; padding: 7px 12px; font-size: 14px; }
.cip.secili { background: none; color: var(--ana); border-color: var(--ana); }
.sekmeler { display: flex; background: var(--kart2); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.sekmeler button { flex: 1; border: 0; background: none; padding: 8px; border-radius: 10px; font-weight: 600; color: var(--soluk); }
.sekmeler button.secili { background: var(--kart); color: var(--yazi); box-shadow: var(--golge); }

/* hızlı giriş */
.ekran-tutar { text-align: center; font-family: var(--serif); font-size: 46px; font-weight: 400; padding: 8px 0 2px; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.ekran-tutar.bos-tutar { color: var(--soluk); }
.tus-panel { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom)); background: var(--zemin); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); border-top: 0.5px solid var(--cerceve); margin-top: 8px; }
input.tuslu-aktif { border-color: var(--ana); }
.tus-takimi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 12px; }
.tus-takimi button { border: 0.5px solid var(--cizgi); background: var(--kart); border-radius: 12px; font-size: 22px; padding: 6px 0; box-shadow: var(--golge); }
.kat-izgara { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kat-izgara button { border: 0.5px solid var(--cerceve); background: var(--kart); color: var(--yazi); border-radius: 14px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; box-shadow: var(--golge); min-height: 72px; }
.kat-izgara button .e { font-size: 24px; }
.kat-izgara button small { color: var(--soluk); font-size: 11px; }

/* PIN */
.kilit { min-height: 80dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.kilit h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 22px; letter-spacing: .06em; color: var(--ana); }
.monogram { width: 64px; height: 64px; border-radius: 50%; border: 0.5px solid var(--ana); display: grid; place-items: center; font-family: var(--serif); color: var(--ana); font-size: 18px; letter-spacing: .06em; }
.noktalar { display: flex; gap: 14px; height: 18px; }
.noktalar i { width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--ana); }
.noktalar i.dolu { background: var(--ana); }
.pin-tuslar { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
.pin-tuslar button { width: 76px; height: 76px; border-radius: 50%; border: 0.5px solid var(--cerceve); background: none; font-family: var(--serif); font-size: 28px; color: var(--yazi); }
.pin-tuslar button:active { background: var(--ana-acik); }
.noktalar.salla { animation: salla .4s; }
@keyframes salla { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.pin-not { max-width: 280px; text-align: center; margin: 0; }
.pin-tuslar button.metin { font-family: inherit; font-size: 15px; border: 0; color: var(--soluk); }

/* bildirim */
.bildirim { position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; background: var(--yazi); color: var(--zemin); border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 30; box-shadow: 0 6px 24px rgba(0, 0, 0, .25); font-size: 15px; }
.bildirim button { background: none; border: 0; color: var(--ana); font-weight: 700; filter: brightness(1.4); }
.bildirim.kutlama { background: var(--kart); color: var(--yazi); border: 0.5px solid var(--cerceve); justify-content: flex-start; }
.bildirim.kutlama button { margin-left: auto; }
.bildirim .yildiz { color: var(--ana); font-size: 22px; display: inline-block; animation: parilti .9s ease-out; }
@keyframes parilti { 0% { transform: scale(0) rotate(-90deg); opacity: 0; } 60% { transform: scale(1.4) rotate(15deg); opacity: 1; text-shadow: 0 0 12px var(--ana); } 100% { transform: scale(1) rotate(0); } }
.ozet-kart { border: 0.5px solid var(--cerceve); }
.adimlar { display: flex; gap: 4px; margin: 4px 0 14px; }
.adimlar i { flex: 1; height: 4px; border-radius: 9px; background: var(--cizgi); }
.adimlar i.tamam { background: var(--ana); }
.kucuk-btn { border: 0; background: none; color: var(--ana); font-weight: 600; padding: 4px; }
.ay-secici { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 10px; }
.ay-secici button { border: 0; background: var(--kart); width: 40px; height: 40px; border-radius: 12px; font-size: 20px; box-shadow: var(--golge); }
.ay-secici div { text-align: center; }
details.kova > summary { list-style: none; cursor: pointer; }
details.kova > summary::-webkit-details-marker { display: none; }
.alt-liste { padding: 0 16px 8px 64px; font-size: 14px; }
.alt-liste .ikili { padding: 4px 0; border-bottom: 1px dashed var(--cizgi); }

/* özel bankacılık parçaları */
.hero { padding: 4px 4px 16px; }
.etiket-k { font-size: 11px; letter-spacing: .14em; color: var(--soluk); }
.hero .buyuk, .sayfa .buyuk { font-size: 40px; line-height: 1.1; margin-top: 2px; }
.kesir { font-size: .55em; color: var(--soluk); }
.tl { color: var(--ana); font-size: .6em; }
.grafik { display: block; width: 100%; height: 46px; margin: 10px 0 8px; }
.ucluk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ucluk .serif { font-size: 16px; margin-top: 2px; }
.buyuk-orta { font-family: var(--serif); font-size: 26px; color: var(--ana); font-variant-numeric: lining-nums tabular-nums; }
.ayrac { border-top: 0.5px solid var(--cizgi); margin-top: 12px; padding-top: 10px; }
.bag { background: none; border: 0; padding: 8px 0 0; font-size: 13px; text-align: left; }
.altin { color: var(--ana); }
.uyari-kart { border-color: #6b4a2a; }
label.bag { display: block; text-align: center; cursor: pointer; }
.pm { display: inline-flex; align-items: center; gap: 10px; }
.pm button { width: 34px; height: 34px; border-radius: 50%; border: 0.5px solid var(--cerceve); background: none; color: var(--ana); font-size: 19px; line-height: 1; }
.pm button:active { background: var(--ana-acik); }
.dagit-satir { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; }
.dagit-satir + .dagit-satir { border-top: 0.5px solid var(--cizgi); }
.cubuklar { display: flex; align-items: flex-end; gap: 8px; height: 72px; margin: 8px 0 4px; }
.cubuklar i { flex: 1; background: var(--cerceve); border-radius: 4px 4px 0 0; min-height: 2px; }
.cubuklar i.son { background: var(--ana); }
.cubuk-ay { display: flex; gap: 8px; font-size: 11px; color: var(--soluk); }
.cubuk-ay span { flex: 1; text-align: center; }
</style>
</head>

<main id="uyg"><div class="kilit"><h1>BANK OF USY</h1><p class="soluk">Açılıyor…</p></div></main>
<nav class="alt" id="menu" hidden>
  <button data-ekran="ozet"><svg><use href="#s-ozet"/></svg>Özet</button>
  <button data-ekran="ay"><svg><use href="#s-ay"/></svg>Ay</button>
